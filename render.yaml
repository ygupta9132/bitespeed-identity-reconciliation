# Render blueprint.
#
# The database is deliberately NOT declared here. Render's free Postgres expires after
# 30 days, which would leave the endpoint in the README returning 500s a month after
# submission. The database lives on Neon instead, and DATABASE_URL is set in the Render
# dashboard.
services:
  - type: web
    name: bitespeed-identity-reconciliation
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: DATABASE_URL
        sync: false
